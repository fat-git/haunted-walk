name: Scheduled full-history secret scan

on:
  schedule:
    # 03:17 UTC daily — off the hour so it is not the default everyone uses.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-full-history:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # PR runs only cover the PR range; this scan covers every commit on
      # main so a secret that landed earlier is still caught.
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
