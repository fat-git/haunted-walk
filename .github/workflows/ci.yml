name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify no keys in dist
        run: |
          if grep -rEi 'sk-[a-zA-Z0-9]{20,}|gh[pous]_[A-Za-z0-9]{36}|AKIA[0-9A-Z]{16}' dist/; then
            echo "::error::Secret-like string found in build output"
            exit 1
          fi
          echo "No secrets found in dist"